<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Shield Popup</title>
    <link rel="stylesheet" href="css/popup.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Privacy Shield</h1>
        <div class="stats-card">
            <p>Trackers Blocked on this Page:</p>
            <span id="blockedCount" class="count">0</span>
        </div>
        <div class="actions">
            <button id="optionsBtn" class="btn">Manage Settings</button>
            <button id="whitelistCurrentSiteBtn" class="btn btn-outline">Whitelist Current Site</button>
        </div>
    </div>
    <script src="js/popup.js"></script>
</body>
</html>
