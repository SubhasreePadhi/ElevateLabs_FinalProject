<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulnScan - Web App Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>VulnScan: Web Application Vulnerability Scanner</h1>
        <p class="description">Enter a target URL to scan for common vulnerabilities like XSS, SQL Injection, and CSRF.</p>

        <form action="{{ url_for('scan') }}" method="post" class="scan-form">
            <div class="form-group">
                <label for="target_url">Target URL:</label>
                <input type="url" id="target_url" name="target_url" placeholder="e.g., http://testphp.vulnweb.com" required>
            </div>
            <div class="form-group">
                <label for="scan_depth">Scan Depth (0 for current page, 1 for links, etc.):</label>
                <input type="number" id="scan_depth" name="scan_depth" value="0" min="0" max="2">
            </div>
            <button type="submit" class="btn-scan">Start Scan</button>
        </form>
    </div>
</body>
</html>
